<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HiveDocker</title><style>body{font:16px system-ui;background:#101216;color:#eee;max-width:640px;margin:48px auto;padding:20px}button,input{padding:12px;margin:6px;border-radius:6px}pre{white-space:pre-wrap}a{color:#5ce4ae}</style>
<h1>HiveDocker</h1><label>Token do painel <input id="token" type="password" autocomplete="off"></label>
<button id="save">Entrar</button><p id="message" role="status"></p>
<button id="pair">Vincular aparelho</button><button id="start">Conectar</button><button id="stop">Pausar</button><button id="logout">Desvincular</button>
<p id="code"></p><a id="approval" target="_blank" rel="noreferrer"></a><pre id="status"></pre>
<script>
let token=sessionStorage.getItem('panelToken')||'', polling;
document.querySelector('#token').value=token;
async function api(path,body){const r=await fetch('/api'+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha');return d}
async function refresh(){try{document.querySelector('#status').textContent=JSON.stringify(await api('/status'),null,2);document.querySelector('#message').textContent=''}catch(e){document.querySelector('#message').textContent=e.message}}
document.querySelector('#save').onclick=()=>{token=document.querySelector('#token').value;sessionStorage.setItem('panelToken',token);refresh()};
for(const name of ['start','stop','logout'])document.querySelector('#'+name).onclick=async()=>{try{await api(name==='logout'?'/logout':'/tunnel/'+name,{});refresh()}catch(e){document.querySelector('#message').textContent=e.message}};
document.querySelector('#pair').onclick=async()=>{clearInterval(polling);try{const {data}=await api('/auth/start',{});document.querySelector('#code').textContent='Código: '+data.userCode;const a=document.querySelector('#approval');a.href=data.verificationUri;a.textContent='Abrir painel para aprovar';const end=Date.now()+300000;polling=setInterval(async()=>{if(Date.now()>end){clearInterval(polling);return}try{const p=await api('/auth/poll',{deviceCode:data.deviceCode});if(p.data.status==='success'){clearInterval(polling);document.querySelector('#code').textContent='Vinculado';refresh()}}catch(e){clearInterval(polling);document.querySelector('#message').textContent=e.message}},5000)}catch(e){document.querySelector('#message').textContent=e.message}};
setInterval(()=>{if(token)refresh()},5000);if(token)refresh();
</script></html>
